name: CI

on:
  push:
    branches: [main, beta, stable]
  pull_request:

jobs:
  php:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l sur tous les fichiers
        run: |
          set -e
          find . -name '*.php' -not -path './resources/*' -print0 | xargs -0 -n1 php -l
      - name: info.json valide
        run: php -r 'json_decode(file_get_contents("plugin_info/info.json"), true, 512, JSON_THROW_ON_ERROR); echo "ok\n";'

  python:
    name: Python ${{ matrix.python }} (script + tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dépendances (comme install_apt.sh)
        run: |
          python -m pip install --upgrade pip
          pip install -r resources/pronote/requirements.txt pytest
          pip install -r resources/pronote/requirements-qr.txt || echo "::warning::décodage QR indisponible sur ce Python (attendu en 3.9)"
      - name: Compilation et jeu d'essai
        run: |
          python -m py_compile resources/pronote/pronote_fetch.py
          python resources/pronote/pronote_fetch.py --selftest | python -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] and len(d['data']['_lessons'])>10; print('selftest ok,', len(d['data']), 'clés')"
      - name: Tests unitaires du script
        run: pytest -q tests/test_fetch.py
